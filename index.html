<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cecelia's TV</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(125deg,#38216d,#8748a6 55%,#ef91c9);color:white;min-height:100vh}header{padding:4vh 5vw 1vh;display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(30px,4vw,65px);margin:0}small{font-size:18px}main{padding:2vh 5vw}.subtitle{font-size:clamp(19px,2vw,30px);margin-bottom:4vh}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2vw}.tile{min-height:22vh;border:3px solid #ffffff55;border-radius:25px;background:#ffffff24;color:white;text-align:left;padding:2vw;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}.tile:focus,.tile:hover{outline:5px solid #ffe36f;background:#ffffff45;transform:scale(1.02)}.emoji{font-size:clamp(40px,6vw,85px)}.name{font-size:clamp(21px,2.4vw,37px);font-weight:bold}.desc{font-size:clamp(14px,1.3vw,21px)}#detail{display:none;background:#24144ccc;min-height:100vh;padding:6vw}#detail h2{font-size:clamp(30px,4vw,60px)}#detail p{font-size:clamp(18px,2vw,30px);line-height:1.5}#back{background:#ffcced;color:#3b175b;border:0;border-radius:16px;padding:18px 30px;font-size:24px}#back:focus{outline:5px solid #ffe36f}footer{padding:3vh 5vw;color:#f9e7ff;font-size:16px}@media(max-width:650px){.tiles{grid-template-columns:repeat(2,1fr)}.tile{min-height:190px}}</style></head><body><section id="home"><header><div><small>✨ A little world of your own</small><h1>Welcome, Cecelia! 💜</h1></div><div style="font-size:5vw">🌸</div></header><main><p class="subtitle">What shall we do today?</p><div class="tiles" id="tiles"><button class="tile" data-title="Ditto's Arcade" data-info="Your favourite games will live here. Next we'll add console sections for Game Boy Advance, SNES and more, with cover art and controller-friendly navigation."><span class="emoji">🎮</span><span class="name">Ditto's Arcade</span><span class="desc">Games and favourites</span></button><button class="tile" data-title="Ask Professor Tangrowth" data-info="This is a demonstration screen. Voice questions and spoken answers aren't connected yet; we'll test microphone access and child-safety controls separately."><span class="emoji">🌿</span><span class="name">Professor Tangrowth</span><span class="desc">Questions and discoveries</span></button><button class="tile" data-title="Achievements" data-info="A future home for your Explorer Level, gardening and hygiene achievements, and Pokémon evolutions. No chores or points are tracked yet."><span class="emoji">🏆</span><span class="name">Achievements</span><span class="desc">Grow and level up</span></button><button class="tile" data-title="Streaming Apps" data-info="Your normal Samsung apps remain available from the TV Home button. This prototype cannot directly launch Netflix or Disney+ from the browser."><span class="emoji">📺</span><span class="name">Watch TV</span><span class="desc">Netflix, Disney+ and more</span></button><button class="tile" data-title="Family Notes" data-info="We can later test handwritten messages from a phone, but live notes aren't connected in this prototype."><span class="emoji">💌</span><span class="name">Family Notes</span><span class="desc">A message just for you</span></button><button class="tile" data-title="My Favourites" data-info="We'll put Cecelia's favourite games and activities here once we know which ones she wants."><span class="emoji">⭐</span><span class="name">My Favourites</span><span class="desc">Your special picks</span></button></div></main><footer>Use the remote arrows to choose a tile, then press OK. Press Back to return.</footer></section><section id="detail"><button id="back">← Back to Cecelia's TV</button><h2 id="detailTitle"></h2><p id="detailInfo"></p></section><script>var home=document.getElementById('home'),detail=document.getElementById('detail'),back=document.getElementById('back'),last=null;function show(el){last=el;document.getElementById('detailTitle').textContent=el.dataset.title;document.getElementById('detailInfo').textContent=el.dataset.info;home.style.display='none';detail.style.display='block';back.focus()}function closeDetail(){detail.style.display='none';home.style.display='block';(last||document.querySelector('.tile')).focus()}document.querySelectorAll('.tile').forEach(function(el){el.addEventListener('click',function(){show(el)})});back.addEventListener('click',closeDetail);document.addEventListener('keydown',function(e){if(detail.style.display==='block'){if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closeDetail()}return}var tiles=[].slice.call(document.querySelectorAll('.tile')),i=tiles.indexOf(document.activeElement);if(i<0){if(['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].indexOf(e.key)>=0){e.preventDefault();tiles[0].focus()}return}var cols=window.innerWidth<=650?2:3,j=i;if(e.key==='ArrowRight')j=Math.min(tiles.length-1,i+1);if(e.key==='ArrowLeft')j=Math.max(0,i-1);if(e.key==='ArrowDown')j=Math.min(tiles.length-1,i+cols);if(e.key==='ArrowUp')j=Math.max(0,i-cols);if(j!==i){e.preventDefault();tiles[j].focus()}});document.querySelector('.tile').focus();</script></body></html>
